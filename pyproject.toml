[project]
name = "asyncgui"
version = "1.0.0"
description = "A minimalistic async library that focuses on fast responsiveness"
authors = [{ name = "Nattōsai Mitō", email = "flow4re2c@gmail.com" }]
requires-python = ">=3.11,<4.0"
license = "MIT"
readme = "README.md"
keywords = ["async"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Documentation = "https://asyncgui.github.io/asyncgui/"
Repository = "https://github.com/asyncgui/asyncgui"

[dependency-groups]
dev = [
    "pytest>=7.0.1,<10",
    "ruff>=0.17.1",
]
doc = [
    "sphinx>=7.0.0,<8",
    "sphinx-tabs>=3.4.1,<4",
    "furo>=2023.9.10,<2024",
]

[tool.uv]
default-groups = ["dev", ]

[build-system]
requires = ["uv_build>=0.9.2,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
xfail_strict = true
addopts = "--maxfail=4 --strict-markers"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
ignore = [
    "B006", "B008",
    "E401", "E402", "I001",
    # "PLW0211",
    "PLR0206",
    "PYI042", "PYI061",
    "RUF010", "RUF013", "RUF022",
    "SIM117",
    "UP007",  # Unionを用いないとsphinxでエラーが起きる
]
extend-select = [
    "E501", "Q000",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/test_*.py" = ["E501"]
"tests/test_Task.py" = ["B018"]
"tests/test_StatefulEvent.py" = ["B018"]
